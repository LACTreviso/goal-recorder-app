name: Costruisci APK Goal Recorder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chiave di firma (dai Secrets del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -f
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i Secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # 1) la chiave: tolgo a capo, spazi e caratteri estranei finiti dentro con il copia-incolla
          CHIAVE=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          printf '%s' "$CHIAVE" | base64 -d > app/goalrecorder.keystore 2>/dev/null || true
          if [ "$(sha256sum app/goalrecorder.keystore | cut -d' ' -f1)" != "0acda9b2cd2737c6af14a02b64290fa98ae8177df7f551f25676a5670d91cb68" ]; then
            echo "::error::Il Secret KEYSTORE_BASE64 non e' giusto (${#CHIAVE} caratteri, devono essere 3696): rimettilo incollando TUTTO il testo di keystore_base64.txt"
            exit 1
          fi
          echo "KEYSTORE_BASE64: OK"
          # 2) la password: provo il testo intero e ogni parola dentro (va bene anche se e' stata incollata la riga intera del LEGGIMI)
          PW=""
          for prova in "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')" $(printf '%s' "$KEYSTORE_PASSWORD" | tr -s ' \t\r\n.:()"' '\n'); do
            [ ${#prova} -ge 6 ] || continue
            if keytool -list -storetype PKCS12 -keystore app/goalrecorder.keystore -storepass "$prova" > /dev/null 2>&1; then PW="$prova"; break; fi
          done
          if [ -z "$PW" ]; then
            echo "::error::La chiave e' giusta ma il Secret KEYSTORE_PASSWORD no ($(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n' | wc -c) caratteri, la password ne ha 20): rimettilo copiando la password da LEGGIMI_chiave.txt (riga 'Password chiave')"
            exit 1
          fi
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD: OK"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Compila
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepara il file
        run: cp app/build/outputs/apk/release/app-release.apk GoalRecorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoalRecorder-apk
          path: GoalRecorder.apk

      - name: Pubblica l'APK (sempre allo stesso link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk GoalRecorder.apk --title "Goal Recorder 1.0.${{ github.run_number }}" \
            --notes "APK di Goal Recorder (Lega Amatori Calcio Treviso). Si installa sopra la versione precedente." --latest
