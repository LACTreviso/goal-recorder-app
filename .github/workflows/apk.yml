name: Costruisci APK Goal Recorder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chiave di firma (dai Secrets del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i Secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # tolgo a capo, spazi e caratteri estranei finiti dentro con il copia-incolla
          CHIAVE=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          echo "::add-mask::$PW"
          echo "KEYSTORE_BASE64: ${#CHIAVE} caratteri (giusto: 3696)"
          if [ "${#CHIAVE}" -ne 3696 ] || ! printf '%s' "$CHIAVE" | base64 -d > app/goalrecorder.keystore 2>/dev/null; then
            echo "::error::Il Secret KEYSTORE_BASE64 non e' giusto (${#CHIAVE} caratteri invece di 3696): rimettilo incollando TUTTO il testo di keystore_base64.txt"
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore app/goalrecorder.keystore -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::La chiave c'e' ma la password non la apre: rimetti il Secret KEYSTORE_PASSWORD copiando solo la password da LEGGIMI_chiave.txt"
            exit 1
          fi
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "Chiave di firma OK"

      - name: Compila
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepara il file
        run: cp app/build/outputs/apk/release/app-release.apk GoalRecorder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoalRecorder-apk
          path: GoalRecorder.apk

      - name: Pubblica l'APK (sempre allo stesso link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk GoalRecorder.apk --title "Goal Recorder 1.0.${{ github.run_number }}" \
            --notes "APK di Goal Recorder (Lega Amatori Calcio Treviso). Si installa sopra la versione precedente." --latest
